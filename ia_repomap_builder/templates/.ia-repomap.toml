# Repository-local ia_repomap declaration (schema v1).
# The canonical contract is maintained in intacct-repo-intelligence.
# Keep generated maps, caches, and context bundles outside the repository.
schema_version = 1
engine = "ripwire"
scope = ["app/source"]
# Keep changed-symbol rows available for large PRs; the adapter still applies
# its own bounded candidate and evidence limits after parsing.
token_budget = 30000
php_family_extensions = [
  ".php", ".phtml", ".cls", ".ent", ".inc", ".cqry", ".rpt",
  ".menu", ".pol", ".wfl", ".shortcuts", ".qry", ".bin", ".map",
]
map_php_scope = ["app/source"]
