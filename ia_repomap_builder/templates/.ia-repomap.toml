# Repository-local ia_repomap declaration (schema v1).
# See docs/design/ia-repomap-context-contract.md for the contract.
# Keep generated maps, caches, and context bundles outside the repository.
schema_version = 1
engine = "ripwire"
scope = ["app/source"]
token_budget = 4000
php_family_extensions = [
  ".php", ".phtml", ".cls", ".ent", ".inc", ".cqry", ".rpt",
  ".menu", ".pol", ".wfl", ".shortcuts", ".qry", ".bin", ".map",
]
map_php_scope = ["app/source"]
