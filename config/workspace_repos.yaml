# Operator-local checkout roots are intentionally configuration, not identity.
version: 1
repositories:
  - repo_key: ia-main
    name: Intacct Main
    kind: monorepo
    language: php
    remote_url: git@github.com:intacct/ia-app.git
    local_root: ~/projects/main
    tracked_branch: main
    enabled: true
    profile: intacct_app
    depends_on: null
    builders:
      - scan
      - symbols
      - relationships
      - entities
      - entity_roots
      - workflows
      - security
      - openapi_scan
      - api_registry
      - openapi_link
      - rest_endpoints
      - entity_access_links
  - repo_key: ia-restapi-automation
    name: IA REST API Automation
    kind: monorepo
    language: gherkin
    remote_url: git@github.com:intacct/ia-restapi-automation.git
    local_root: ~/projects/ia-restapi-automation
    tracked_branch: main
    enabled: false
    profile: rest_automation
    depends_on:
      - ia-main
    builders:
      - scan
      - symbols
      - relationships
      - gherkin_coverage
    rest_automation:
      features_root: src/test/resources/features/rest-api
      object_mapping: src/test/resources/object-mapping.json
  - repo_key: ia-restapi-automation-tests
    name: IA REST API Automation Tests
    kind: monorepo
    language: gherkin
    remote_url: git@github.com:intacct/ia-restapi-automation-tests.git
    local_root: ~/projects/ia-restapi-automation-tests
    tracked_branch: main
    enabled: false
    profile: rest_automation
    depends_on:
      - ia-main
    builders:
      - scan
      - symbols
      - relationships
      - gherkin_coverage
    rest_automation:
      coverage_contract_version: 1
      features_root: features
  - repo_key: ia-gwdata-gl
    name: IA Gateway GL Automation
    kind: automation
    language: xml
    remote_url: git@github.com:intacct/ia-gwdata-gl.git
    local_root: ~/projects/ia-gwdata-gl
    tracked_branch: main
    enabled: true
    profile: xml_gateway_automation
    storage: sidecar
    depends_on:
      - ia-main
    builders: []
