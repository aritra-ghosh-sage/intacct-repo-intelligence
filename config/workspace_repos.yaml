# Operator-local checkout roots are intentionally configuration, not identity.
version: 1
repositories:
  - repo_key: ia-main
    name: Intacct Main
    kind: monorepo
    language: php
    remote_url: git@github.com:intacct/ia-app.git
    local_root: ~/projects/main
    tracked_branch: main
    enabled: true
    profile: intacct_app
    greenfield_analysis:
      role: source
      discovery_eligible: true
    depends_on: null
    ignore_paths:
      - app/appconnect
      - app/resources/thirdparty
      - CI
      - docs
      - rector
      - composer.json
      - tests
      - gwdata
      - README.md
      - app/dev
      - app/external
      - app/tools
      - app/tests/tools
      - app/tests/ci_phpunit.xml
      - app/tests/coverage_config_company.xml
      - app/tests/coverage_config_phpunit_9_5_13.xml
      - app/tests/coverage_config_phpunit_13_2_4.xml
      - app/tests/coverage_config.xml
      - app/tests/devtools
      - app/unitTest
      - app/resources/css
      - app/resources/qx/iafonts
      - app/resources/qx/stylus
      - app/resources/cstools
      - app/resources/downloads
      - app/resources/dm
      - app/resources/nextgen
      - app/resources/orgchart
      - app/resources/obi_sa_tool
      - app/resources/theme
      - app/resources/theme2011
      - app/resources/wysiwyg
      - app/resources/images
      - app/resources/sagecopilot
      - app/resources/minus
      - app/xml
      - app/xsd
      - app/db/db_global_migration/global_conf
    ignore_filenames:
      - .gitattributes
      - .gitignore
      - .gitkeep
      - Makefile
      - Makefile.in
      - Makefile.migrate
      - Makefile.queries
      - .core-rules.yml
      - .spectral.yml
      - Makefile.sub
      - base_lib.js.template
      - U2505.0.20250324.230155.001__customer_console_tool_times_out
      - gdpdu-01-08-2002.dtd
      - .stoplight.json
      - template.s1.schema.yaml
    ignore_filename_prefixes:
      - .env
    ignore_suffixes:
      - .bin
      - .cert
      - .cfg
      - .conf
      - .crt
      - .csv
      - .deploy
      - .dll
      - .doc
      - .docx
      - .eot
      - .exe
      - .gif
      - .jar
      - .key
      - .md
      - .mo
      - .pdf
      - .pem
      - .pfg
      - .pfm
      - .po
      - .png
      - .pot
      - .properties
      - .sh
      - .svg
      - .swf
      - .tmpl
      - .ttf
      - .txt
      - .xls
      - .xlsx
      - .woff
      - .woff2
      - .pfb
    builders:
      - scan
      - symbols
      - relationships
      - entities
      - entity_roots
      - workflows
      - security
      - openapi_scan
      - api_registry
      - openapi_link
      - rest_endpoints
      - entity_access_links
  - repo_key: ia-restapi-automation
    name: IA REST API Automation
    kind: monorepo
    language: gherkin
    remote_url: git@github.com:intacct/ia-restapi-automation.git
    local_root: ~/projects/ia-restapi-automation
    tracked_branch: main
    enabled: false
    profile: rest_automation
    greenfield_analysis:
      role: test
      discovery_eligible: true
      test_roots:
        - src/test/resources/features/rest-api
      test_formats:
        - gherkin
    depends_on:
      - ia-main
    builders:
      - scan
      - symbols
      - relationships
      - gherkin_coverage
    rest_automation:
      features_root: src/test/resources/features/rest-api
      object_mapping: src/test/resources/object-mapping.json
  - repo_key: ia-restapi-automation-tests
    name: IA REST API Automation Tests
    kind: monorepo
    language: gherkin
    remote_url: git@github.com:intacct/ia-restapi-automation-tests.git
    local_root: ~/projects/ia-restapi-automation-tests
    tracked_branch: main
    enabled: true
    profile: rest_automation
    greenfield_analysis:
      role: test
      discovery_eligible: true
      test_roots:
        - features
      test_formats:
        - gherkin
    depends_on:
      - ia-main
    pr_impact_contracts:
      - type: tests_rest_of
        source_repository: intacct/ia-restapi-automation-tests
        target_repository: intacct/ia-app
    builders:
      - scan
      - symbols
      - relationships
      - gherkin_coverage
    rest_automation:
      coverage_contract_version: 1
      features_root: features
  - repo_key: ia-gwdata-gl
    name: IA Gateway GL Automation
    kind: automation
    language: xml
    remote_url: git@github.com:intacct/ia-gwdata-gl.git
    local_root: ~/projects/ia-gwdata-gl
    tracked_branch: main
    enabled: true
    profile: xml_gateway_automation
    greenfield_analysis:
      role: test
      discovery_eligible: true
      test_roots:
        - testdefinitions
        - testscripts
      test_formats:
        - csv
        - xml
    storage: sidecar
    depends_on:
      - ia-main
    pr_impact_contracts:
      - type: validates_gateway_behavior_of
        source_repository: intacct/ia-gwdata-gl
        target_repository: intacct/ia-app
    builders: []
