# Non-secret defaults for the Greenfield Strands runtime.
# Do not store AWS access keys, secret keys, session tokens, or API tokens here.
# Supply credentials through the standard AWS provider chain instead.

region: us-west-2
profile: null
# Step 1.5 emits one large JSON trace, so prefer a large-output model. The
# Bedrock inference profile must be enabled in the account and `region` above.
# Use a dated, versioned profile so a run stays reproducible; undated aliases
# such as `us.anthropic.claude-sonnet-5` move underneath pinned evidence.
model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
timeout_seconds: 300
# Claude Sonnet 4.5 allows 64,000 generated tokens; 32,000 leaves headroom while
# bounding runaway generations. Amazon Nova models cap output at 5,000.
max_tokens: 32000
# Continuation attempts after the model stops at its output ceiling mid-JSON.
max_continuations: 2